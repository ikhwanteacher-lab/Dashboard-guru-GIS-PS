<html lang="id" data-theme="light">

<style>
:root{
  --bg:#fbf6f9; --card:#ffffff; --text:#2a1226; --muted:#7a6477; --border:#eddde8;
  --primary:#cf005e; --primary-d:#a8004c; --soft:#fdebf3; --on-primary:#ffffff;
  --danger:#dc2626; --warn:#f7941d; --info:#3b82f6; --ok:#10b981;
  --shadow:0 1px 2px rgba(98,4,92,.05),0 8px 24px -12px rgba(98,4,92,.14);
  --radius:16px;
}
html[data-theme="dark"]{
  --bg:#140812; --card:#1e0f1b; --text:#f7edf4; --muted:#b7a0b2; --border:#3b2236;
  --primary:#ff4f9a; --primary-d:#e8187a; --soft:rgba(255,79,154,.14); --on-primary:#2a0018;
  --danger:#ff6b6b; --warn:#ffb347; --info:#60a5fa; --ok:#34d399;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:Fredoka,Inter,sans-serif;margin:0;font-weight:600;letter-spacing:.2px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--primary);color:var(--on-primary);border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(.95)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 10px;border-radius:10px;font-size:13px}
.btn.icon{padding:8px;border-radius:10px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical;min-height:80px}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:500}
.fld{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.grow{flex:1;min-width:140px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--primary-d);font-size:12px;font-weight:600}
html[data-theme="dark"] .badge{color:var(--primary)}
.badge.L{background:rgba(59,130,246,.14);color:var(--info)} .badge.P{background:rgba(236,72,153,.14);color:#ec4899}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:400px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 8px 20px -6px var(--primary)}
.logo svg{width:26px;height:26px}
.login h1{font-size:28px;margin:14px 0 2px}

/* shell */
#app{display:flex;min-height:100vh}
#side{width:250px;flex:none;background:var(--card);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand h2{font-size:20px}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:500}
.nav:hover{background:var(--soft);color:var(--text)}
.nav.on{background:var(--soft);color:var(--primary-d);font-weight:600}
html[data-theme="dark"] .nav.on{color:var(--primary)}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top .sp{flex:1}
#burger{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font-size:24px}
.scrim{display:none}
@media(max-width:900px){
  #side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  #side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
  #burger{display:inline-flex}
  main{padding:16px 14px 60px}
}

/* quick cards (mengikuti referensi) */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.qc{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.qc:hover{border-color:var(--primary);transform:translateY(-2px)}
.qc .ic{width:46px;height:46px;border-radius:14px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin-bottom:14px;box-shadow:0 6px 16px -6px var(--primary)}
.qc h4{font-size:16px;margin-bottom:4px}
.qc p{margin:0;color:var(--muted);font-size:13.5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat .n{font-family:Fredoka;font-size:32px;font-weight:600;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.card h3{font-size:17px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:42px;border-radius:8px 8px 4px 4px;background:var(--primary);min-height:4px}
.bar i.none{background:var(--border)}
.list-i{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.list-i:first-of-type{border-top:0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600}
td.wrap{white-space:normal}
.num{text-align:center}
td input.sc{width:78px;padding:6px 8px;text-align:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters>*{flex:1;min-width:150px}

/* jurnal */
.jr{display:flex;gap:14px;margin-bottom:12px}
.jr .d{flex:none;width:58px;text-align:center;background:var(--soft);border-radius:14px;padding:8px 0;color:var(--primary-d)}
html[data-theme="dark"] .jr .d{color:var(--primary)}
.jr .d b{display:block;font-family:Fredoka;font-size:22px;line-height:1}
.jr .d span{font-size:11px}
.jr .b{flex:1;min-width:0}
.jr .b h4{font-size:16px;margin:4px 0 2px}
.jr .b p{margin:0;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.jr .a{display:flex;gap:6px;align-items:flex-start}
.jr .b p.jd{margin:6px 0 0;font-size:14px}
.jr .b p.jd b{color:var(--text);font-weight:600}
.att{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--soft)}
.att .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-weight:600}
.att .hd .badge.full{background:rgba(16,185,129,.16);color:var(--ok)}
.att .hd .badge.part{background:rgba(245,158,11,.18);color:var(--warn)}
.att .bd{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.att .bd>div:first-child{width:170px}
.att .stt{flex:1;min-width:180px;font-style:italic;color:var(--muted);padding-bottom:10px}

/* tabs */
.tabs{display:inline-flex;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* kehadiran */
.st{display:flex;gap:6px}
.pill input{position:absolute;opacity:0;width:0;height:0}
.pill{position:relative}
.pill span{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-weight:600;color:var(--muted)}
.pill input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.pill.H input:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.S input:checked+span{background:var(--info);border-color:var(--info);color:#fff}
.pill.I input:checked+span{background:var(--warn);border-color:var(--warn);color:#1b1300}
.pill.A input:checked+span{background:var(--danger);border-color:var(--danger);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}

/* nilai */
.dist{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.dist .t{flex:1;height:12px;background:var(--border);border-radius:99px;overflow:hidden}
.dist .t i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.dist b{width:22px}
.dist em{width:30px;text-align:right;font-style:normal;color:var(--muted)}
.fail{color:var(--danger);font-weight:600}

/* picker */
.slot{margin:16px auto;max-width:620px;border-radius:24px;border:2px solid var(--primary);background:var(--soft);padding:34px 16px;text-align:center;overflow:hidden}
.slot .nm{font-family:Fredoka;font-size:clamp(28px,6vw,52px);font-weight:600;min-height:1.3em;word-break:break-word}
.slot.done .nm{animation:pop .45s ease}
.slot .sub{color:var(--muted);min-height:1.4em}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.hist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* tim */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.team h4{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.team ol{margin:0;padding-left:20px}
.team li{padding:2px 0;display:list-item}
.team li .badge{margin-left:6px;padding:0 7px;font-size:11px}

.pick{max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:12px}
.pick label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.pick label:last-child{border-bottom:0}
.pick label:hover{background:var(--soft)}

.hi{display:flex;flex-direction:column;gap:16px}
.hi-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hi-h h3{margin:0}
.hi-big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hi-big .n{font-family:Fredoka;font-size:46px;font-weight:600;line-height:1}
.hi-bar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;background:var(--border)}
.hi-bar i{display:block;min-width:8px}
.hi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:auto}
.hi-t{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;color:var(--muted)}
.hi-t b{margin-left:auto;font-family:Fredoka;font-size:22px;color:var(--text)}
.hi-t .dot{width:10px;height:10px;border-radius:50%;flex:none}
.hi .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}

.cus{border:1px dashed var(--border);border-radius:14px;padding:12px;margin:4px 0 14px;background:var(--soft)}
td input.sc{width:70px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(2,8,16,.55);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.sheet h3{font-size:20px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.tt{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;box-shadow:var(--shadow)}
.tt.err{background:var(--danger);color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* tema: warna logo Gistrav Islamia School */
:root{--grad:linear-gradient(135deg,#62045c 0%,#cf005e 50%,#fc1444 80%,#f7941d 100%);--grad-btn:linear-gradient(135deg,#cf005e,#e8114f)}
.btn:not(.ghost):not(.danger){background:var(--grad-btn);color:#fff}
.logo,.qc .ic{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px #cf005e}
.bar i:not(.none){background:linear-gradient(180deg,#fc1444,#cf005e)}
.nav.on{box-shadow:inset 3px 0 0 var(--primary)}
.login{background:radial-gradient(900px 500px at 85% -10%,rgba(207,0,94,.14),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(247,148,29,.12),transparent 60%)}
.ph h2,.login h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

@media(max-width:900px){.filters>div{flex:1 1 150px;min-width:0}.filters select,.filters input{width:100%;min-width:0}}

@media(max-width:520px){.quick .qc:last-child:nth-child(odd){grid-column:1/-1}}
</style>
</head>

  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',

function call(action, payload) {
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('Gagal memuat Firebase. Periksa koneksi internet.')), 20000));
  return Promise.race([window.__fbReady, timeout]).then(api => api(action, payload || {}))
    .catch(e => { if (e && e.auth) { clearSession(); showLogin(); } throw e; });
}
function clearSession() { TOKEN = null; store.del('tk'); S.user = null; }

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'tt' + (type === 'err' ? ' err' : '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function unduhCSV(nama, rows) {
  // Titik koma + baris "sep=;" agar Excel (termasuk pengaturan regional Indonesia) memisahkan kolom dengan benar
  const dec = (1.5).toLocaleString().charAt(1) === ',' ? ',' : '.';
  const cell = c => {
    let s = String(c ?? '');
    if (/^-?\d+\.\d+$/.test(s)) { if (dec === ',') s = s.replace('.', ','); }
    else if (/^[=+@-]/.test(s)) s = "'" + s;
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = '\ufeff' + 'sep=;\r\n' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = nama; document.body.appendChild(a); a.click(); a.remove();
}
function salin(teks) {
  const ta = document.createElement('textarea'); ta.value = teks; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Tersalin ke clipboard.'); } catch (e) { toast('Gagal menyalin.', 'err'); }
  ta.remove();
}

        const nm = { mapel: 'mata pelajaran', jam: 'waktu / jam', metode: 'metode pembelajaran' };
        for (const n of ['mapel', 'jam', 'metode']) {
          if (d[n] === '__lain') { d[n] = (d[n + '_lain'] || '').trim(); if (!d[n]) throw new Error('Isi kolom tambahan untuk ' + nm[n] + '.'); }
          delete d[n + '_lain'];
        }
        await call('jurnalSave', d); toast(j.id ? 'Jurnal diperbarui.' : 'Jurnal disimpan.');
        PIL = await call('pilihanList'); await reload();
      }, 'Simpan jurnal');
    $('#sheet').style.maxWidth = '780px';
    const upd = reset => {
      const k = $('#jk').value, n = S.siswa.filter(s => s.kelas === k).length, inp = $('#jh');
      inp.max = n || '';
      if (reset) inp.value = n || '';
      if (n && +inp.value > n) inp.value = n;
      const h = +inp.value || 0, b = $('#jb');
      if (!k) { b.textContent = 'Pilih kelas/halaqah dulu'; b.className = 'badge'; $('#js').textContent = ''; return; }
      if (!n) { b.textContent = 'Belum ada anggota di kelas/halaqah ini'; b.className = 'badge'; $('#js').textContent = 'Isi jumlah hadir secara manual.'; return; }
      b.textContent = `${h} / ${n} murid hadir${h === n ? ' (lengkap)' : ''}`;
      b.className = 'badge ' + (h === n ? 'full' : 'part');
      $('#js').textContent = h === n ? `Semua murid hadir lengkap (${n} murid).` : `${n - h} murid tidak hadir dari ${n} murid.`;
    };
    const f = $('#mf');
    f.addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'jk') upd(true);
      if (t.dataset.lain) {
        const li = f.elements[t.dataset.lain + '_lain'];
        li.classList.toggle('hidden', t.value !== '__lain');
        if (t.value === '__lain') li.focus();
      }
    });
    f.addEventListener('input', e => { if (e.target.id === 'jh') upd(false); });
    upd(false);
  };
  $('#add').onclick = () => form();
  v.oninput = e => { if (e.target.matches('#q')) draw(); };
  v.onchange = e => { if (e.target.matches('#fk,#fb')) draw(); };
  v.onclick = async e => {
    const ed = e.target.closest('[data-e]'), de = e.target.closest('[data-d]');
    if (ed) form(list.find(x => x.id === ed.dataset.e));
    if (de && await confirmBox('Hapus jurnal ini? Tindakan ini tidak bisa dibatalkan.')) {
      try { await call('jurnalDelete', { id: de.dataset.d }); toast('Jurnal dihapus.'); await reload(); } catch (er) { toast(er.message, 'err'); }
    }
  };
  draw();
}

/* ============ Kalkulator Nilai ============ */
const NS = { kelas: '', urut: false, nt: 3 };
async function pNilai() {
  const ks = kelasAll();
  if (!ks.length) { $('#view').innerHTML = `<div class="ph"><h2>Kalkulator Nilai</h2></div>${noKelas()}`; return; }
  if (!ks.includes(NS.kelas)) NS.kelas = ks[0];
  const v = $('#view');
  const w = (store.get('w2') || '40,60,75').split(',').map(Number);
  NS.nt = Math.min(5, Math.max(1, +store.get('nt') || NS.nt));
  v.innerHTML = `<div class="ph"><h2>Kalkulator Nilai</h2></div>
    <div class="card" style="margin-bottom:16px"><div class="filters">
      <div><label class="f">Kelas/Halaqah</label><select id="nk">${kelasOpts(NS.kelas)}</select></div>
      <div><label class="f">Jumlah kolom tugas (maks. 5)</label><select id="nt">${[1, 2, 3, 4, 5].map(n => `<option ${n === NS.nt ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div><label class="f">Bobot rata-rata tugas (%)</label><input type="number" id="w1" min="0" value="${w[0]}"></div>
      <div><label class="f">Bobot UTS/UAS (%)</label><input type="number" id="w2" min="0" value="${w[1]}"></div>
      <div><label class="f">KKM</label><input type="number" id="kkm" min="0" max="100" value="${w[2]}"></div>
      <div><label class="f">Bahasa deskripsi</label><select id="dl"><option value="id">Indonesia</option><option value="en">English</option></select></div>
      <div style="flex:1 1 260px"><label class="f">Materi / tujuan pembelajaran</label><input id="dm" placeholder="mis. operasi hitung pecahan"></div>
      <div><label class="row" style="gap:6px;margin-top:22px"><input type="checkbox" id="dn" checked> Sertakan nama</label></div>
    </div></div>
    <div class="two"><div class="card" id="ns"></div><div class="card" id="nd"></div></div>
    <div class="card"><div class="row" style="margin-bottom:10px"><label class="row" style="gap:6px"><input type="checkbox" id="nu" ${NS.urut ? 'checked' : ''}> Urutkan berdasarkan ranking</label><span class="grow"></span><button class="btn ghost" id="nx">${ico('down')} Ekspor CSV</button><button class="btn" id="nsv">Simpan nilai</button></div>
      <div class="tw"><table><thead id="nh"></thead><tbody id="nb"></tbody></table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Rata Tugas dihitung otomatis dari kolom tugas yang terisi. Nilai akhir = rata tugas × bobot tugas + UTS/UAS × bobot UTS/UAS. Deskripsi dibuat otomatis dari nilai akhir (90–100 A Sempurna, 70–89 B Baik, 50–69 C Cukup, 0–49 D Kurang) dan materi yang Anda isi. Nilai akhir dibulatkan ke bilangan bulat.</p></div>`;
  let list = [], hasil = [];
  $('#dl').value = store.get('dl') || 'id'; $('#dm').value = store.get('dm_' + NS.kelas) || '';
  const huruf = n => n >= 90 ? 'A' : n >= 70 ? 'B' : n >= 50 ? 'C' : 'D';
  const num = x => (x === '' || x == null || isNaN(+x)) ? null : Math.max(0, Math.min(100, +x));
  const r2 = x => Math.round(x * 100) / 100;
  const deskOf = (i, ak) => fxDesk(list[i].nama, i, ak, $('#dl').value, $('#dm').value.trim(), $('#dn').checked);
  const deskHtml = (i, ak) => { const d = deskOf(i, ak); return `<b>${d.kat}</b> — ${esc(d.teks)}`; };
  const rataT = s => { const a = s.ts.slice(0, NS.nt).map(num).filter(x => x !== null); return a.length ? r2(a.reduce((p, c) => p + c, 0) / a.length) : null; };
  const heads = () => { $('#nh').innerHTML = `<tr><th>No</th><th>Nama</th>${Array.from({ length: NS.nt }, (_, i) => `<th class="num">Tugas ${i + 1}</th>`).join('')}<th class="num">Rata Tugas</th><th class="num">UTS/UAS</th><th class="num">Akhir</th><th class="num">Predikat</th><th class="num">Rank</th><th>Deskripsi</th></tr>`; };
  const hitung = () => {
    const ws = [+$('#w1').value || 0, +$('#w2').value || 0], sw = ws[0] + ws[1], kkm = +$('#kkm').value || 0;
    store.set('w2', [...ws, kkm].join(','));
    hasil = list.map((s, i) => {
      const rt = rataT(s), uu = num(s.u);
      if ((rt === null && uu === null) || !sw) return { i, rata: rt, akhir: null };
      return { i, rata: rt, akhir: Math.round(((rt || 0) * ws[0] + (uu || 0) * ws[1]) / sw) };
    });
    const dinilai = hasil.filter(h => h.akhir !== null).sort((a, b) => b.akhir - a.akhir);
    dinilai.forEach((h, idx) => { h.rank = idx > 0 && dinilai[idx - 1].akhir === h.akhir ? dinilai[idx - 1].rank : idx + 1; h.huruf = huruf(h.akhir); });
    hasil.forEach(h => {
      const ak = $('#ak' + h.i); if (!ak) return;
      $('#rt' + h.i).textContent = h.rata === null ? '—' : h.rata;
      ak.textContent = h.akhir === null ? '—' : h.akhir;
      ak.className = 'num' + (h.akhir !== null && h.akhir < kkm ? ' fail' : '');
      $('#pr' + h.i).textContent = h.akhir === null ? '—' : h.huruf;
      $('#rk' + h.i).textContent = h.akhir === null ? '—' : h.rank;
      const dd = $('#ds' + h.i); if (dd) dd.innerHTML = h.akhir === null ? '—' : deskHtml(h.i, h.akhir);
    });
    if (!dinilai.length) {
      $('#ns').innerHTML = '<h3>Ringkasan</h3><div class="empty">Isi nilai siswa untuk melihat ringkasan.</div>';
      $('#nd').innerHTML = '<h3>Distribusi nilai</h3><div class="empty">—</div>';
      return;
    }
    const arr = dinilai.map(h => h.akhir), rata = arr.reduce((a, b) => a + b, 0) / arr.length;
    const lulus = arr.filter(x => x >= kkm).length;
    $('#ns').innerHTML = `<h3>Ringkasan</h3><div class="stats" style="margin:0"><div class="stat"><div class="n">${rata.toFixed(1)}</div><div class="l">Rata-rata (${arr.length} siswa)</div></div><div class="stat"><div class="n">${arr[0]}</div><div class="l">Tertinggi — ${esc(list[dinilai[0].i].nama)}</div></div><div class="stat"><div class="n">${arr[arr.length - 1]}</div><div class="l">Terendah — ${esc(list[dinilai[dinilai.length - 1].i].nama)}</div></div><div class="stat"><div class="n">${lulus}/${arr.length}</div><div class="l">Tuntas KKM ${kkm}</div></div></div>`;
    $('#nd').innerHTML = '<h3>Distribusi nilai</h3>' + [['A', '90–100'], ['B', '70–89'], ['C', '50–69'], ['D', '0–49']].map(([h, r]) => { const c = dinilai.filter(x => x.huruf === h).length; return `<div class="dist"><b>${h}</b><div class="t"><i style="width:${c / dinilai.length * 100}%"></i></div><em>${c}</em><span class="muted" style="width:52px">${r}</span></div>`; }).join('');
  };
  const rows = () => {
    heads();
    const ord = list.map((s, i) => i);
    if (NS.urut) { hitung(); const r = {}; hasil.forEach(h => r[h.i] = h.akhir === null ? 1e9 : h.rank); ord.sort((a, b) => r[a] - r[b]); }
    $('#nb').innerHTML = ord.map((i, n) => { const s = list[i]; return `<tr><td>${n + 1}</td><td>${esc(s.nama)} ${gBadge(s.gender)}</td>${Array.from({ length: NS.nt }, (_, k) => `<td class="num"><input class="sc" type="number" min="0" max="100" step="any" data-i="${i}" data-f="t${k}" aria-label="Tugas ${k + 1} ${esc(s.nama)}" value="${esc(s.ts[k])}"></td>`).join('')}<td class="num" id="rt${i}">—</td><td class="num"><input class="sc" type="number" min="0" max="100" step="any" data-i="${i}" data-f="u" aria-label="UTS/UAS ${esc(s.nama)}" value="${esc(s.u)}"></td><td class="num" id="ak${i}">—</td><td class="num" id="pr${i}">—</td><td class="num" id="rk${i}">—</td><td id="ds${i}" style="min-width:280px;font-size:13px">—</td></tr>`; }).join('');
    hitung();
  };
  const muat = async () => {
    const saved = await call('nilaiGet', { kelas: NS.kelas });
    let hi = 0;
    list = siswaKelas(NS.kelas).map(s => {
      const sv = saved[s.id];
      let ts = sv && sv.ts ? sv.ts.map(x => (x == null ? '' : String(x))) : ['', '', '', '', ''];
      while (ts.length < 5) ts.push('');
      if (sv && ts.every(x => x === '') && sv.t !== '' && sv.t != null) ts[0] = String(sv.t);   // data lama: rata-rata tugas jadi Tugas 1
      let u = sv && sv.u != null ? String(sv.u) : '';
      if (sv && sv.a !== '' && sv.a != null) u = u !== '' ? String(r2((+u + +sv.a) / 2)) : String(sv.a);   // data lama: UTS & UAS digabung
      ts.forEach((x, k) => { if (x !== '') hi = Math.max(hi, k + 1); });
      return { id: s.id, nama: s.nama, gender: s.gender, ts, u };
    });
    if (hi > NS.nt) { NS.nt = hi; store.set('nt', hi); $('#nt').value = hi; }
    rows();
  };
  v.oninput = e => {
    const t = e.target;
    if (t.matches('.sc')) { const s = list[+t.dataset.i]; if (t.dataset.f === 'u') s.u = t.value; else s.ts[+t.dataset.f.slice(1)] = t.value; hitung(); }
    else if (t.matches('#w1,#w2,#kkm')) hitung();
    else if (t.matches('#dm')) { store.set('dm_' + NS.kelas, t.value); hitung(); }
  };
  v.onchange = async e => {
    const id = e.target.id;
    if (id === 'nk') { NS.kelas = e.target.value; $('#dm').value = store.get('dm_' + NS.kelas) || ''; await muat(); }
    if (id === 'nu') { NS.urut = e.target.checked; rows(); }
    if (id === 'dl') { store.set('dl', e.target.value); hitung(); }
    if (id === 'dn') hitung();
    if (id === 'nt') {
      const n = +e.target.value;
      if (n < NS.nt && list.some(s => s.ts.slice(n, NS.nt).some(x => x !== ''))) {
        if (!await confirmBox(`Kolom Tugas ${n + 1}–${NS.nt} berisi nilai dan akan dihapus. Lanjutkan?`, 'Lanjutkan')) { e.target.value = NS.nt; return; }
        list.forEach(s => { for (let k = n; k < 5; k++) s.ts[k] = ''; });
      }
      NS.nt = n; store.set('nt', n); rows();
    }
  };
  v.onclick = async e => {
    if (e.target.closest('#nsv')) {
      const b = $('#nsv'); b.disabled = true;
      const kirim = list.filter(s => s.ts.slice(0, NS.nt).some(x => x !== '') || s.u !== '').map(s => ({ siswaId: s.id, t: s.ts.map((x, k) => k < NS.nt ? x : ''), uts: s.u }));
      try { await call('nilaiSave', { kelas: NS.kelas, rows: kirim }); toast('Nilai tersimpan. Rata tugas tercatat otomatis.'); } catch (er) { toast(er.message, 'err'); }
      b.disabled = false;
    }
    if (e.target.closest('#nx')) {
      hitung(); const r = {}; hasil.forEach(h => r[h.i] = h);
      const th = Array.from({ length: NS.nt }, (_, k) => 'Tugas ' + (k + 1));
      unduhCSV(`nilai-${NS.kelas}.csv`, [['No', 'Nama', 'L/P', ...th, 'Rata Tugas', 'UTS/UAS', 'Akhir', 'Predikat', 'Rank', 'Kategori', 'Deskripsi']].concat(list.map((s, i) => [i + 1, s.nama, s.gender, ...s.ts.slice(0, NS.nt), r[i].rata ?? '', s.u, r[i].akhir ?? '', r[i].huruf ?? '', r[i].rank ?? '', ...(r[i].akhir == null ? ['', ''] : (d => [d.kat, d.teks])(deskOf(i, r[i].akhir)))])));
    }
  };

}

/* ============ Daftar custom (dipakai Pemilih Nama & Pembagi Kelompok) ============ */
const CUS = { picks: [], manual: [] };
const nmNorm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
function cusPool() {
  const seen = new Set(), out = [];
  CUS.picks.map(s => ({ id: s.id, nama: s.nama, gender: s.gender || '', kelas: 'Custom', kelasAsli: s.kelasAsli || '' }))
    .concat(CUS.manual.map(m => ({ id: 'm:' + nmNorm(m.nama), nama: m.nama, gender: m.gender || '', kelas: 'Custom', kelasAsli: '' })))
    .forEach(s => { if (!seen.has(s.id) && !seen.has('n:' + nmNorm(s.nama))) { seen.add(s.id); seen.add('n:' + nmNorm(s.nama)); out.push(s); } });
  return out;
}
function cusPanel() {
  const L = cusPool();
  return `<div class="cus"><div class="row" style="margin-bottom:8px"><b class="grow">Daftar custom: ${L.length} nama</b><button class="btn ghost sm" id="cp">Pilih dari daftar siswa</button><button class="btn ghost sm" id="cm">Input manual</button>${L.length ? '<button class="btn ghost sm" id="cc">Kosongkan</button>' : ''}</div>
    <div class="hist">${L.length ? L.map(s => `<span class="badge">${esc(s.nama)} <button type="button" data-cx="${esc(s.id)}" aria-label="Hapus ${esc(s.nama)}" style="border:0;background:none;cursor:pointer;color:inherit;padding:0 0 0 4px">✕</button></span>`).join('') : '<span class="muted">Belum ada nama. Pilih dari daftar siswa atau ketik manual.</span>'}</div></div>`;
}
function cusClick(e, rerender) {
  const x = e.target.closest('[data-cx]');
  if (x) { const id = x.dataset.cx; CUS.picks = CUS.picks.filter(s => s.id !== id); CUS.manual = CUS.manual.filter(m => 'm:' + nmNorm(m.nama) !== id); rerender(); return true; }
  if (e.target.closest('#cp')) { formCusPilih(rerender); return true; }
  if (e.target.closest('#cm')) { formCusManual(rerender); return true; }
  if (e.target.closest('#cc')) { CUS.picks = []; CUS.manual = []; rerender(); return true; }
  return false;
}
async function formCusPilih(rerender) {
  const M = await call('masterList');
  const ks = [...new Set(M.map(s => s.kelas))].sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
  const pilih = new Set(CUS.picks.map(s => s.id));
  modal('Pilih dari daftar siswa', `
    <div class="row"><input id="pq" class="grow" style="flex:2" placeholder="Cari nama…"><select id="pkl" class="grow"><option value="">Semua kelas</option>${ks.map(k => `<option>${esc(k)}</option>`).join('')}</select></div>
    <div class="pick" id="pl" style="margin:10px 0 6px"></div>
    <div class="row" style="justify-content:space-between"><span class="muted" id="pc" style="font-size:13px"></span><span><button type="button" class="btn ghost sm" id="pa">Pilih semua yang tampil</button> <button type="button" class="btn ghost sm" id="pz">Batalkan semua</button></span></div>`,
    async () => {
      CUS.picks = M.filter(s => pilih.has(s.id)).map(s => ({ id: s.id, nama: s.nama, gender: s.gender, kelasAsli: s.kelas }));
      rerender();
    }, 'Terapkan');
  $('#sheet').style.maxWidth = '560px';
  let tampil = [];
  const info = () => { $('#pc').textContent = `${pilih.size} dipilih • ${M.length} siswa`; };
  const draw = () => {
    const q = $('#pq').value.toLowerCase(), k = $('#pkl').value;
    tampil = M.filter(s => (!k || s.kelas === k) && (!q || s.nama.toLowerCase().includes(q)));
    $('#pl').innerHTML = tampil.length ? tampil.map(s => `<label><input type="checkbox" value="${s.id}" ${pilih.has(s.id) ? 'checked' : ''}><span class="grow">${esc(s.nama)}</span><span class="muted">Kelas ${esc(s.kelas)}</span>${gBadge(s.gender)}</label>`).join('') : '<div class="empty" style="padding:16px">Tidak ada siswa yang cocok.</div>';
    info();
  };
  $('#pq').oninput = draw; $('#pkl').onchange = draw;
  $('#pl').onchange = e => { if (e.target.type === 'checkbox') { e.target.checked ? pilih.add(e.target.value) : pilih.delete(e.target.value); info(); } };
  $('#pa').onclick = () => { tampil.forEach(s => pilih.add(s.id)); draw(); };
  $('#pz').onclick = () => { pilih.clear(); draw(); };
  draw();
}
function formCusManual(rerender) {
  const cur = CUS.manual.map(m => m.nama + (m.gender ? '; ' + m.gender : '')).join('\n');
  modal('Input nama manual', `
    <div class="fld"><label class="f">Satu nama per baris. Tambahkan "; L" atau "; P" bila ingin memakai filter gender (opsional)</label><textarea name="teks" rows="10" placeholder="Ahmad Fauzi; L&#10;Siti Aisyah; P&#10;Budi">${esc(cur)}</textarea></div>
    <div class="muted" style="font-size:13px">Nama yang diketik di sini terpisah dari data siswa dan tidak disimpan ke data induk.</div>`,
    async d => {
      const seen = new Set();
      CUS.manual = (d.teks || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
        const p = l.split(/[;\t,]/).map(x => x.trim()).filter(Boolean);
        const g = p.slice(1).find(x => /^(l|p|lk|pr|laki-laki|perempuan)$/i.test(x));
        return { nama: p[0], gender: g ? (/^(l|lk|laki-laki)$/i.test(g) ? 'L' : 'P') : '' };
      }).filter(m => { const k = nmNorm(m.nama); if (!k || seen.has(k)) return false; seen.add(k); return true; });
      rerender();
    }, 'Terapkan');
  $('#sheet').style.maxWidth = '520px';
}

/* ============ Pemilih Nama Acak ============ */
const PK = { src: 'kelas', kelas: '', gender: '', noRepeat: true, picked: [] };
async function pPicker() {
  const v = $('#view'), cust = PK.src === 'custom';
  v.innerHTML = `<div class="ph"><h2>Pemilih Nama Acak</h2></div>
    <div class="card"><div class="filters">
      <div><label class="f">Sumber nama</label><select id="psrc"><option value="kelas" ${cust ? '' : 'selected'}>Kelas/halaqah saya</option><option value="custom" ${cust ? 'selected' : ''}>Custom (manual / pilih dari daftar)</option></select></div>
      ${cust ? '' : `<div><label class="f">Kelas/Halaqah</label><select id="pk">${kelasOpts(PK.kelas, 'Semua kelas/halaqah')}</select></div>`}
      <div><label class="f">Gender</label><select id="pg"><option value="">Semua</option><option value="L" ${PK.gender === 'L' ? 'selected' : ''}>Laki-laki</option><option value="P" ${PK.gender === 'P' ? 'selected' : ''}>Perempuan</option></select></div>
      <div style="display:flex;align-items:flex-end"><label class="row" style="gap:6px;padding-bottom:10px"><input type="checkbox" id="pn" ${PK.noRepeat ? 'checked' : ''}> Jangan ulangi nama yang sudah terpilih</label></div>
    </div>
    ${cust ? cusPanel() : ''}
    <div class="slot" id="slot"><div class="nm" id="snm">?</div><div class="sub" id="ssub"></div></div>
    <div class="row" style="justify-content:center"><button class="btn" id="go" style="font-size:17px;padding:12px 28px">${ico('shuffle')} Acak nama</button><button class="btn ghost" id="rs">Reset riwayat</button></div>
    <h3 style="margin-top:20px">Riwayat terpilih</h3><div class="hist" id="hist"></div></div>`;
  const pool = () => {
    const seen = new Set();
    const base = cust ? cusPool() : S.siswa.filter(s => !PK.kelas || s.kelas === PK.kelas);
    return base.filter(s => !PK.gender || s.gender === PK.gender).filter(s => seen.has(s.id) ? false : (seen.add(s.id), true));
  };
  const avail = () => pool().filter(s => !PK.noRepeat || !PK.picked.some(p => p.id === s.id));
  const info = () => {
    $('#ssub').textContent = `${avail().length} dari ${pool().length} nama tersedia` + (cust && PK.gender ? ' (nama tanpa data gender tidak ikut)' : '');
    $('#hist').innerHTML = PK.picked.length ? PK.picked.map((p, i) => `<span class="badge">${i + 1}. ${esc(p.nama)}</span>`).join('') : '<span class="muted">Belum ada.</span>';
  };
  let busy = false;
  v.onchange = e => {
    const id = e.target.id;
    if (id === 'psrc') { PK.src = e.target.value; PK.picked = []; pPicker(); return; }
    if (id === 'pk') PK.kelas = e.target.value;
    if (id === 'pg') PK.gender = e.target.value;
    if (id === 'pn') PK.noRepeat = e.target.checked;
    info();
  };
  v.onclick = e => {
    if (cusClick(e, pPicker)) return;
    if (e.target.closest('#rs')) { PK.picked = []; $('#snm').textContent = '?'; $('#slot').classList.remove('done'); info(); }
    if (e.target.closest('#go')) {
      if (busy) return;
      const a = avail();
      if (!a.length) return toast(pool().length ? 'Semua nama sudah terpilih. Tekan "Reset riwayat".' : (cust ? 'Daftar custom masih kosong atau tidak cocok dengan filter gender.' : 'Tidak ada siswa yang cocok. Buat kelas/halaqah dulu atau pakai sumber Custom.'), 'err');
      const final = a[Math.floor(Math.random() * a.length)], all = pool();
      busy = true; $('#slot').classList.remove('done'); $('#go').disabled = true;
      let i = 0, delay = 45; const steps = 26;
      const tick = () => {
        if (i++ < steps) { $('#snm').textContent = all[Math.floor(Math.random() * all.length)].nama; delay += i > 16 ? 28 : 0; setTimeout(tick, delay); }
        else { $('#snm').textContent = final.nama; $('#slot').classList.add('done'); PK.picked.push(final); busy = false; $('#go').disabled = false; info(); }
      };
      tick();
    }
  };
  info();
}

const TK = { src: 'kelas', kelas: '', gender: '', mode: 'jumlah', n: 4, balance: true, hasil: null };
async function pTim() {
  const ks = kelasAll(), cust = TK.src === 'custom';
  if (!ks.includes(TK.kelas)) TK.kelas = ks[0] || '';
  const v = $('#view');
  v.innerHTML = `<div class="ph"><h2>Pembagi Kelompok</h2></div>
    <div class="card"><div class="filters">
      <div><label class="f">Sumber nama</label><select id="tsrc"><option value="kelas" ${cust ? '' : 'selected'}>Kelas/halaqah saya</option><option value="custom" ${cust ? 'selected' : ''}>Custom (manual / pilih dari daftar)</option></select></div>
      ${cust ? '' : `<div><label class="f">Kelas/Halaqah</label><select id="tk">${kelasOpts(TK.kelas)}</select></div>`}
      <div><label class="f">Filter gender</label><select id="tg"><option value="">Semua</option><option value="L" ${TK.gender === 'L' ? 'selected' : ''}>Laki-laki saja</option><option value="P" ${TK.gender === 'P' ? 'selected' : ''}>Perempuan saja</option></select></div>
      <div><label class="f">Bagi berdasarkan</label><select id="tm"><option value="jumlah" ${TK.mode === 'jumlah' ? 'selected' : ''}>Jumlah kelompok</option><option value="ukuran" ${TK.mode === 'ukuran' ? 'selected' : ''}>Anggota per kelompok</option></select></div>
      <div><label class="f" id="tl"></label><input type="number" id="tn" min="1" value="${TK.n}"></div>
    </div>
    ${cust ? cusPanel() : ''}
    <div class="row"><label class="row" style="gap:6px"><input type="checkbox" id="tb" ${TK.balance ? 'checked' : ''}> Seimbangkan komposisi gender tiap kelompok</label><label class="row" style="gap:6px"><input type="checkbox" id="tp" ${TK.pisah ? 'checked' : ''}> Pisahkan kelompok sesuai gender</label><span class="grow"></span><span class="muted" id="ti"></span><button class="btn" id="tgo">${ico('shuffle')} Acak kelompok</button></div></div>
    <div id="tr"></div>`;
  const pool = () => (cust ? cusPool() : S.siswa.filter(s => s.kelas === TK.kelas)).filter(s => !TK.gender || s.gender === TK.gender);
  const label = () => { $('#tl').textContent = TK.mode === 'jumlah' ? 'Jumlah kelompok' : 'Anggota per kelompok'; $('#ti').textContent = `${pool().length} siswa terpilih`; $('#tb').disabled = !!TK.gender || !!TK.pisah; $('#tp').disabled = !!TK.gender || !!TK.balance; };
  const tampil = () => {
    const h = TK.hasil;
    if (!h) { $('#tr').innerHTML = ''; return; }
    $('#tr').innerHTML = `<div class="row" style="margin-top:14px"><button class="btn ghost" id="tc">Salin hasil</button><button class="btn ghost" id="tx">${ico('down')} Ekspor CSV</button></div><div class="teams">${h.map((g, i) => `<div class="card team"><h4>Kelompok ${i + 1}<span class="badge">${g.length} orang</span></h4><ol>${g.map(s => `<li>${esc(s.nama)}${gBadge(s.gender)}</li>`).join('')}</ol></div>`).join('')}</div>`;
  };
  const acak = () => {
    const p = pool();
    if (!p.length) { toast(cust ? 'Daftar custom masih kosong atau tidak cocok dengan filter gender.' : 'Tidak ada siswa yang cocok. Buat kelas/halaqah dulu atau pakai sumber Custom.', 'err'); return; }
    if (TK.pisah && !TK.gender) { const gs = fxPisah(p, TK.mode, TK.n); if (TK.mode === 'jumlah' && TK.n < gs.length) toast('Jumlah kelompok dinaikkan menjadi ' + gs.length + ' agar tiap gender punya kelompok sendiri.'); TK.hasil = gs; tampil(); return; }
    let n = TK.mode === 'jumlah' ? TK.n : Math.ceil(p.length / TK.n);
    n = Math.max(1, Math.min(n || 1, p.length));
    let urut;
    if (TK.balance && !TK.gender) urut = [...shuffle(p.filter(s => s.gender === 'L')), ...shuffle(p.filter(s => s.gender === 'P')), ...shuffle(p.filter(s => s.gender !== 'L' && s.gender !== 'P'))];
    else urut = shuffle(p);
    const g = Array.from({ length: n }, () => []);
    urut.forEach((s, i) => g[i % n].push(s));
    TK.hasil = g; tampil();
  };
  v.onchange = e => {
    const id = e.target.id;
    if (id === 'tsrc') { TK.src = e.target.value; TK.hasil = null; pTim(); return; }
    if (id === 'tk') { TK.kelas = e.target.value; TK.hasil = null; tampil(); }
    if (id === 'tg') { TK.gender = e.target.value; TK.hasil = null; tampil(); }
    if (id === 'tm') TK.mode = e.target.value;
    if (id === 'tb') TK.balance = e.target.checked;
    if (id === 'tp') TK.pisah = e.target.checked;
    label();
  };
  v.oninput = e => { if (e.target.id === 'tn') TK.n = Math.max(1, parseInt(e.target.value) || 1); };
  v.onclick = e => {
    if (cusClick(e, () => { TK.hasil = null; pTim(); })) return;
    if (e.target.closest('#tgo')) acak();
    if (e.target.closest('#tc') && TK.hasil) salin(TK.hasil.map((g, i) => `Kelompok ${i + 1}\n` + g.map((s, j) => `${j + 1}. ${s.nama}`).join('\n')).join('\n\n'));
    if (e.target.closest('#tx') && TK.hasil) { const r = [['Kelompok', 'Nama', 'L/P']]; TK.hasil.forEach((g, i) => g.forEach(s => r.push([i + 1, s.nama, s.gender]))); unduhCSV(`kelompok-${cust ? 'custom' : TK.kelas}.csv`, r); }
  };
  label(); tampil();
}

function buatHalaqah() {
  modal('Buat kelas/halaqah', `<div class="fld"><label class="f">Nama kelas/halaqah</label><input name="nama" placeholder="mis. Halaqah Ust. Ahmad" required maxlength="60"></div>`,
    async d => { SF.hid = await call('halaqahSave', { nama: d.nama }); toast('Kelas/Halaqah dibuat.'); pSiswa(); }, 'Buat');
}

async function pSiswa() {
  await muatSiswa();
  const v = $('#view');
  if (!S.halaqah.some(h => h.id === SF.hid)) SF.hid = S.halaqah.length ? S.halaqah[0].id : '';
  if (!S.halaqah.length) {
    v.innerHTML = `<div class="ph"><h2>Kelas/Halaqah & Siswa</h2></div><div class="card empty"><b>Belum ada kelas/halaqah.</b><br>Kelas/Halaqah adalah kelompok siswa yang Anda ajar dan boleh berisi siswa dari kelas berbeda. Siswa diambil dari data induk bersama, jadi tidak perlu input ulang.<br><br><button class="btn" id="hn">${ico('plus')} Buat kelas/halaqah pertama</button></div>`;
    $('#hn').onclick = buatHalaqah;
    return;
  }
  const hl = S.halaqah.find(h => h.id === SF.hid);
  const mem = S.siswa.filter(s => s.halaqahId === SF.hid).sort((a, b) => a.nama.localeCompare(b.nama, 'id'));
  const kc = {}; mem.forEach(s => { kc[s.kelasAsli] = (kc[s.kelasAsli] || 0) + 1; });
  const ringkas = Object.keys(kc).sort((a, b) => a.localeCompare(b, 'id', { numeric: true })).map(k => `Kelas ${esc(k)} (${kc[k]})`).join(', ');
  v.innerHTML = `<div class="ph"><h2>Kelas/Halaqah & Siswa</h2><button class="btn ghost" id="hn">${ico('plus')} Buat kelas/halaqah</button></div>
    <div class="card" style="margin-bottom:14px"><div class="row">
      <div class="grow"><label class="f">Kelas/Halaqah</label><select id="hs">${S.halaqah.map(h => `<option value="${h.id}" ${h.id === SF.hid ? 'selected' : ''}>${esc(h.nama)} (${h.jumlah})</option>`).join('')}</select></div>
      <button class="btn ghost" id="hr" style="align-self:flex-end">Ubah nama</button><button class="btn ghost" id="hd" style="align-self:flex-end">Hapus kelas/halaqah</button></div>
      <div class="muted" style="margin-top:10px">${mem.length ? `<b>${mem.length} anggota</b>: ${ringkas}` : 'Belum ada anggota.'}</div></div>
    <div class="row" style="margin-bottom:14px"><button class="btn" id="ap">${ico('plus')} Tambah dari daftar siswa</button><button class="btn ghost" id="am">Siswa baru (manual)</button><button class="btn ghost" id="ai">Impor daftar</button></div>
    <div class="card"><div class="tw">${mem.length ? `<table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>L/P</th><th></th></tr></thead><tbody>${mem.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.nama)}</td><td>${esc(s.kelasAsli)}</td><td>${gBadge(s.gender)}</td><td style="text-align:right"><button class="btn ghost sm" data-rm="${s.id}">Keluarkan</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Tambahkan siswa dari daftar yang sudah ada, atau input manual bila belum terdaftar.</div>'}</div></div>`;
  const re = () => pSiswa();
  $('#hn').onclick = buatHalaqah;
  $('#hs').onchange = e => { SF.hid = e.target.value; pSiswa(); };
  $('#hr').onclick = () => modal('Ubah nama kelas/halaqah', `<div class="fld"><label class="f">Nama kelas/halaqah</label><input name="nama" value="${esc(hl.nama)}" required maxlength="60"></div><p class="muted" style="font-size:13px">Riwayat jurnal, absensi, dan nilai ikut menyesuaikan nama baru.</p>`,
    async d => { await call('halaqahSave', { id: hl.id, nama: d.nama }); toast('Nama kelas/halaqah diperbarui.'); re(); });
  $('#hd').onclick = async () => {
    if (!await confirmBox(`Hapus kelas/halaqah "${hl.nama}"? Anggota hanya dikeluarkan dari kelas/halaqah ini; data siswa induk tidak terhapus. Riwayat jurnal dan absensi tetap tersimpan.`)) return;
    try { await call('halaqahDelete', { id: hl.id }); toast('Kelas/Halaqah dihapus.'); re(); } catch (er) { toast(er.message, 'err'); }
  };
  $('#ap').onclick = () => formPilih(SF.hid, re);
  $('#am').onclick = () => formSiswaBaru(SF.hid, re);
  $('#ai').onclick = () => formImpor(SF.hid, re);
  v.onclick = async e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      const s = mem.find(x => x.id === rm.dataset.rm);
      if (await confirmBox(`Keluarkan ${s.nama} dari kelas/halaqah ini? Data siswa tetap ada di daftar induk.`, 'Keluarkan')) {
        try { await call('anggotaHapus', { halaqahId: SF.hid, siswaId: s.id }); toast('Siswa dikeluarkan dari kelas/halaqah.'); re(); } catch (er) { toast(er.message, 'err'); }
      }
    }
  };
}

/* ============ Pengaturan ============ */
async function pPengaturan() {
  const v = $('#view');
  const pil = await call('pilihanList');
  const st = null;
  const meta = [['mapel', 'Mata pelajaran', 'mis. Fiqih'], ['jam', 'Waktu / jam', 'mis. Jam ke-1 atau 07.00–08.00']];
  const hapusCard = true
    ? '<p class="muted" style="margin:0">Akun dikelola lewat Firebase Console (menu Authentication).</p>'
    : (st && st.status === 'menunggu')
      ? `<p style="margin-top:0">Pengajuan penghapusan akun Anda <b>menunggu persetujuan admin</b> (diajukan ${fmtIso(st.waktu)}).</p><button class="btn ghost" id="hb">Batalkan pengajuan</button>`
      : `${st && st.status === 'ditolak' ? '<p style="margin-top:0"><span class="badge">Pengajuan terakhir ditolak admin</span></p>' : ''}<p class="muted" style="margin-top:0">Akun baru dihapus setelah admin menyetujui. Jurnal, absensi, nilai, dan kelas/halaqah Anda ikut terhapus; data siswa induk tetap ada.</p><button class="btn danger" id="ha">Ajukan penghapusan akun</button>`;
  v.innerHTML = `<div class="ph"><h2>Pengaturan</h2></div>
    <div class="card" style="margin-bottom:16px"><h3>Pilihan dropdown jurnal</h3>
      <p class="muted" style="margin-top:0">Isi sesuai kebutuhan Anda. Pilihan ini muncul di form Jurnal Mengajar. Pilihan baru yang Anda ketik langsung di form juga tersimpan di sini.</p>
      <div class="two" style="margin:0">${meta.map(m => `<div><label class="f">${m[1]}</label>
        <form class="row" data-pf="${m[0]}" style="flex-wrap:nowrap"><input name="nilai" placeholder="${m[2]}" maxlength="60"><button class="btn" style="flex:none">Tambah</button></form>
        <div class="hist" id="pl_${m[0]}"></div></div>`).join('')}</div></div>
    <div class="two">
      <div class="card"><h3>Ganti password</h3><form id="fp">
        <div class="fld"><label class="f">Password lama</label><input type="password" name="lama" required autocomplete="current-password"></div>
        <div class="fld"><label class="f">Password baru (min. 6 karakter)</label><input type="password" name="baru" minlength="6" required autocomplete="new-password"></div>
        <div class="fld"><label class="f">Ulangi password baru</label><input type="password" name="ulang" required autocomplete="new-password"></div>
        <button class="btn">Simpan password</button></form></div>
      <div class="card"><h3>Hapus akun</h3>${hapusCard}</div>
    </div>`;
  const drawPil = () => meta.forEach(([k]) => {
    $('#pl_' + k).innerHTML = pil[k].length ? pil[k].map((x, i) => `<span class="badge">${esc(x)} <button type="button" data-pd="${k}" data-i="${i}" aria-label="Hapus ${esc(x)}" style="border:0;background:none;cursor:pointer;color:inherit;padding:0 0 0 4px">✕</button></span>`).join('') : '<span class="muted">Belum ada pilihan.</span>';
  });
  drawPil();
  $$('[data-pf]').forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const nilai = f.elements.nilai.value.trim(); if (!nilai) return;
    try { Object.assign(pil, await call('pilihanSave', { jenis: f.dataset.pf, nilai })); f.reset(); drawPil(); } catch (er) { toast(er.message, 'err'); }
  });
  v.onclick = async e => {
    const d = e.target.closest('[data-pd]'); if (!d) return;
    try { Object.assign(pil, await call('pilihanDelete', { jenis: d.dataset.pd, nilai: pil[d.dataset.pd][+d.dataset.i] })); drawPil(); } catch (er) { toast(er.message, 'err'); }
  };
  $('#fp').onsubmit = async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
    if (d.baru !== d.ulang) return toast('Konfirmasi password tidak sama.', 'err');
    try { await call('ubahPassword', d); toast('Password diperbarui.'); e.target.reset(); } catch (er) { toast(er.message, 'err'); }
  };
  if ($('#ha')) $('#ha').onclick = async () => {
    if (!await confirmBox('Ajukan penghapusan akun ke admin? Akun baru dihapus setelah admin menyetujui.', 'Ajukan')) return;
    try { await call('hapusAkunAjukan'); toast('Pengajuan dikirim ke admin.'); pPengaturan(); } catch (er) { toast(er.message, 'err'); }
  };
  if ($('#hb')) $('#hb').onclick = async () => {
    try { await call('hapusAkunBatal'); toast('Pengajuan dibatalkan.'); pPengaturan(); } catch (er) { toast(er.message, 'err'); }
  };
}

/* ============ Panel Admin ============ */
const AD = { tab: 'akun', q: '', kelas: '' };
async function pAdmin() {
  if (!S.user.admin) throw new Error('Halaman ini khusus admin.');
  const v = $('#view');
  const req = await call('permintaanList');
  const menunggu = req.filter(r => r.status === 'menunggu').length;
  v.innerHTML = `<div class="ph"><h2>Panel Admin</h2></div>
    <div class="tabs"><button data-t="akun" class="${AD.tab === 'akun' ? 'on' : ''}">Akun guru</button><button data-t="req" class="${AD.tab === 'req' ? 'on' : ''}">Persetujuan${menunggu ? ` (${menunggu})` : ''}</button><button data-t="siswa" class="${AD.tab === 'siswa' ? 'on' : ''}">Data induk siswa</button></div>
    <div id="ab"></div>`;
  v.onclick = e => { const t = e.target.closest('[data-t]'); if (t) { AD.tab = t.dataset.t; pAdmin(); } };
  if (AD.tab === 'akun') await adminAkun(); else if (AD.tab === 'req') adminReq(req); else await adminSiswa();
}

async function adminAkun() {
  const ab = $('#ab');
  const L = await call('adminUsers');
  ab.innerHTML = `<div class="card"><div class="row" style="margin-bottom:12px"><p class="muted grow" style="margin:0">Admin dapat menghapus akun langsung tanpa persetujuan pengguna. Pengguna biasa harus mengajukan penghapusan dan disetujui admin lebih dulu.</p><button class="btn" id="ua">${ico('plus')} Tambah akun</button></div>
    <div class="tw"><table><thead><tr><th>Nama</th><th>Username</th><th class="num">Kelas/Halaqah</th><th class="num">Siswa</th><th class="num">Jurnal</th><th>Terakhir isi jurnal</th><th></th></tr></thead><tbody>
    ${L.map((x, i) => `<tr><td>${esc(x.nama)} ${x.admin ? '<span class="badge">Admin</span>' : ''} ${x.pengajuan ? '<span class="badge" style="background:rgba(245,158,11,.18);color:var(--warn)">Mengajukan hapus</span>' : ''}</td><td>@${esc(x.username)}</td><td class="num">${x.halaqah}</td><td class="num">${x.siswa}</td><td class="num">${x.jurnal}</td><td>${x.terakhir ? fmtTgl(x.terakhir) : '—'}</td>
    <td style="text-align:right"><button class="btn ghost sm" data-rp="${i}">Reset password</button>${x.admin ? '' : ` <button class="btn ghost icon" data-hu="${i}" aria-label="Hapus akun">${ico('trash')}</button>`}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('#ua').onclick = () => modal('Tambah akun guru', `
    <div class="fld"><label class="f">Nama lengkap</label><input name="nama" required></div>
    <div class="fld"><label class="f">Username</label><input name="username" required autocapitalize="none"></div>
    <div class="fld"><label class="f">Password awal (min. 6 karakter)</label><input type="password" name="password" minlength="6" required autocomplete="new-password"></div>`,
    async d => { await call('adminTambahUser', d); toast('Akun dibuat.'); adminAkun(); }, 'Buat akun');
  ab.onclick = async e => {
    const rp = e.target.closest('[data-rp]'), hu = e.target.closest('[data-hu]');
    if (rp) {
      const x = L[+rp.dataset.rp];
      modal(`Reset password — ${esc(x.nama)}`, `<div class="fld"><label class="f">Password baru (min. 6 karakter)</label><input type="password" name="baru" minlength="6" required autocomplete="new-password"></div>`,
        async d => { await call('adminResetPassword', { username: x.username, baru: d.baru }); toast('Password diatur ulang.'); }, 'Atur ulang');
    }
    if (hu) {
      const x = L[+hu.dataset.hu];
      if (await confirmBox(`Hapus akun ${x.nama} (@${x.username}) beserta jurnal, absensi, nilai, dan halaqahnya? Sebagai admin Anda tidak memerlukan persetujuan pengguna ini. Data siswa induk tidak ikut terhapus.`)) {
        try { await call('adminHapusUser', { username: x.username }); toast('Akun dihapus.'); adminAkun(); } catch (er) { toast(er.message, 'err'); }
      }
    }
  };
}

function adminReq(req) {
  const ab = $('#ab');
  const pend = req.filter(r => r.status === 'menunggu'), hist = req.filter(r => r.status !== 'menunggu');
  const lbl = { disetujui: 'Disetujui', ditolak: 'Ditolak', dibatalkan: 'Dibatalkan pengguna' };
  ab.innerHTML = `<div class="card" style="margin-bottom:16px"><h3>Menunggu persetujuan</h3>
    ${pend.length ? pend.map(r => `<div class="list-i" style="align-items:center;flex-wrap:wrap"><div class="grow"><b>${esc(r.nama)}</b> <span class="muted">@${esc(r.username)}</span><div class="muted" style="font-size:13px">Mengajukan penghapusan akun • ${fmtIso(r.waktu)}</div></div><button class="btn danger sm" data-ok="${r.id}">Setujui & hapus akun</button><button class="btn ghost sm" data-no="${r.id}">Tolak</button></div>`).join('') : '<div class="empty">Tidak ada pengajuan yang menunggu.</div>'}</div>
    <div class="card"><h3>Riwayat</h3>${hist.length ? `<div class="tw"><table><thead><tr><th>Nama</th><th>Diajukan</th><th>Status</th><th>Diproses</th></tr></thead><tbody>${hist.map(r => `<tr><td>${esc(r.nama)} <span class="muted">@${esc(r.username)}</span></td><td>${fmtIso(r.waktu)}</td><td>${lbl[r.status] || esc(r.status)}</td><td>${r.diproses ? fmtIso(r.diproses) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Belum ada riwayat.</div>'}</div>`;
  ab.onclick = async e => {
    const ok = e.target.closest('[data-ok]'), no = e.target.closest('[data-no]');
    const b = ok || no; if (!b) return;
    const r = req.find(x => x.id === (b.dataset.ok || b.dataset.no));
    if (ok && !await confirmBox(`Setujui penghapusan akun ${r.nama}? Jurnal, absensi, nilai, dan halaqahnya akan terhapus permanen.`, 'Setujui & hapus')) return;
    try { await call('permintaanProses', { id: r.id, setuju: !!ok }); toast(ok ? 'Akun dihapus.' : 'Pengajuan ditolak.'); pAdmin(); } catch (er) { toast(er.message, 'err'); }
  };
}

async function panelDuplikat(reload, G) {
  const box = $('#dup');
  if (!G) G = await call('duplikatList');
  if (!G.length) { box.innerHTML = '<div class="card" style="margin-bottom:14px">Tidak ada nama ganda di data induk.</div>'; box.onclick = null; return; }
  box.innerHTML = `<div class="card" style="margin-bottom:14px;border-color:var(--warn)"><div class="row" style="margin-bottom:6px"><b class="grow">${G.length} nama ganda ditemukan</b><button class="btn" id="dg">Gabungkan semua (pertahankan data pertama)</button></div>
    <p class="muted" style="margin-top:0;font-size:13px">Siswa bernama sama digabung menjadi satu. Keanggotaan kelas/halaqah, absensi, dan nilai dipindahkan ke data yang dipertahankan.</p>
    ${G.map((g, i) => `<div class="list-i" style="flex-wrap:wrap;align-items:center"><div class="grow"><b>${esc(g[0].nama)}</b><div class="row" style="gap:14px;margin-top:4px">${g.map((s, j) => `<label class="row" style="gap:6px"><input type="radio" name="k${i}" value="${s.id}" ${j === 0 ? 'checked' : ''}> Kelas ${esc(s.kelas)} <span class="muted">(${s.dipakai} kelas/halaqah)</span></label>`).join('')}</div></div><button class="btn ghost sm" data-g="${i}">Gabungkan</button></div>`).join('')}</div>`;
  const selesai = async n => { toast(`${n} data ganda digabung.`); await muatSiswa(); await reload(); await panelDuplikat(reload); };
  box.onclick = async e => {
    const one = e.target.closest('[data-g]'), all = e.target.closest('#dg');
    if (one) {
      const i = +one.dataset.g, keep = $(`input[name="k${i}"]:checked`, box).value;
      if (!await confirmBox(`Gabungkan data "${G[i][0].nama}" menjadi satu?`, 'Gabungkan')) return;
      try { await selesai(await call('siswaGabung', { keepId: keep, hapusIds: G[i].map(s => s.id).filter(id => id !== keep) })); } catch (er) { toast(er.message, 'err'); }
    }
    if (all) {
      if (!await confirmBox(`Gabungkan semua ${G.length} nama ganda? Data yang paling awal dibuat dipertahankan.`, 'Gabungkan semua')) return;
      try { await selesai(await call('duplikatGabungSemua')); } catch (er) { toast(er.message, 'err'); }
    }
  };
}

async function adminSiswa() {
  const ab = $('#ab');
  let M = await call('masterList');
  ab.innerHTML = `<div class="filters"><input id="mq" placeholder="Cari nama…" value="${esc(AD.q)}"><select id="mk"><option value="">Semua kelas</option>${[...new Set(M.map(s => s.kelas))].sort((a, b) => a.localeCompare(b, 'id', { numeric: true })).map(k => `<option ${k === AD.kelas ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select><button class="btn ghost" id="md" style="flex:none">Periksa duplikat</button><button class="btn ghost" id="mi" style="flex:none">Impor</button><button class="btn" id="mn" style="flex:none">${ico('plus')} Siswa</button></div>
    <div id="dup"></div>
    <div class="card"><p class="muted" style="margin-top:0">Data induk dipakai bersama semua guru. Hanya admin yang dapat mengubah atau menghapus; guru dapat menambah dan memilih siswa untuk halaqahnya.</p><div class="tw" id="ml"></div></div>`;
  const draw = () => {
    const L = M.filter(s => (!AD.kelas || s.kelas === AD.kelas) && (!AD.q || s.nama.toLowerCase().includes(AD.q.toLowerCase())));
    $('#ml').innerHTML = L.length ? `<table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>L/P</th><th class="num">Dipakai di kelas/halaqah</th><th></th></tr></thead><tbody>${L.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.nama)}</td><td>${esc(s.kelas)}</td><td>${gBadge(s.gender)}</td><td class="num">${s.dipakai}</td><td style="text-align:right"><button class="btn ghost icon" data-e="${s.id}" aria-label="Edit">${ico('edit')}</button> <button class="btn ghost icon" data-d="${s.id}" aria-label="Hapus">${ico('trash')}</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Belum ada data siswa.</div>';
  };
  const reload = async () => { M = await call('masterList'); draw(); };
  $('#mq').oninput = e => { AD.q = e.target.value; draw(); };
  $('#mk').onchange = e => { AD.kelas = e.target.value; draw(); };
  $('#mn').onclick = () => formSiswaBaru(undefined, reload);
  $('#mi').onclick = () => formImpor(undefined, reload);
  $('#md').onclick = () => panelDuplikat(reload);
  call('duplikatList').then(G => { if (G.length) panelDuplikat(reload, G); }).catch(() => {});
  ab.onclick = async e => {
    const ed = e.target.closest('[data-e]'), de = e.target.closest('[data-d]');
    if (ed) {
      const s = M.find(x => x.id === ed.dataset.e);
      modal('Edit data siswa', `<div class="fld"><label class="f">Nama</label><input name="nama" value="${esc(s.nama)}" required></div>
        <div class="row"><div class="fld grow"><label class="f">Kelas</label><input name="kelas" value="${esc(s.kelas)}" required></div>
        <div class="fld grow"><label class="f">Gender</label><select name="gender"><option value="">—</option><option value="L" ${s.gender === 'L' ? 'selected' : ''}>Laki-laki</option><option value="P" ${s.gender === 'P' ? 'selected' : ''}>Perempuan</option></select></div></div>`,
        async d => { await call('siswaEdit', { id: s.id, ...d }); toast('Data siswa diperbarui.'); await reload(); });
    }
    if (de) {
      const s = M.find(x => x.id === de.dataset.d);
      if (await confirmBox(`Hapus ${s.nama} dari data induk? Siswa ini juga keluar dari ${s.dipakai} kelas/halaqah dan seluruh absensi serta nilainya ikut terhapus.`)) {
        try { await call('siswaHapus', { id: s.id }); toast('Siswa dihapus.'); await reload(); } catch (er) { toast(er.message, 'err'); }
      }
    }
  };
  draw();
}

/* ============ Admin & Wali (Firebase) ============ */

  const BATAS = 3600000; let tulis = 0;
  const catat = () => { if (!S.user) return; const n = Date.now(); if (n - tulis > 15000) { tulis = n; try { localStorage.setItem('dg_last', String(n)); } catch (e) {} } };
  ['click', 'keydown', 'touchstart', 'scroll', 'mousemove'].forEach(ev => document.addEventListener(ev, catat, { passive: true, capture: true }));
  const cek = async () => {
    if (!S.user) return;
    let l = 0; try { l = +localStorage.getItem('dg_last') || 0; } catch (e) {}
    if (l && Date.now() - l > BATAS) { try { await call('logout'); } catch (e) {} clearSession(); showLogin(); toast('Anda keluar otomatis karena tidak ada aktivitas selama 1 jam.'); }
  };
  setInterval(cek, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cek(); });
})();

/* ============ Pembagi kelompok: pisahkan per gender ============ */
const fxPisah = (p, mode, n) => {
  const cat = [p.filter(s => s.gender === 'L'), p.filter(s => s.gender === 'P'), p.filter(s => s.gender !== 'L' && s.gender !== 'P')].filter(c => c.length);
  let jml;
  if (mode === 'jumlah') {
    n = Math.max(n, cat.length); jml = cat.map(() => 1); let sisa = n - cat.length;
    while (sisa > 0) { let b = -1, bv = 0; cat.forEach((c, i) => { if (jml[i] < c.length && c.length / jml[i] > bv) { bv = c.length / jml[i]; b = i; } }); if (b < 0) break; jml[b]++; sisa--; }
  } else jml = cat.map(c => Math.ceil(c.length / n));
  const g = [];
  cat.forEach((c, i) => { const u = shuffle(c), gg = Array.from({ length: jml[i] }, () => []); u.forEach((s, j) => gg[j % jml[i]].push(s)); g.push(...gg); });
  return g;
};

}
