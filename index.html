<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, reauthenticateWithCredential, EmailAuthProvider, createUserWithEmailAndPassword, updateProfile, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, getDoc, setDoc, addDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAlCZGrM48YxmD_Yny68_FrsB96QS-8S24",
  authDomain: "dashboard-guru-gis-ps.firebaseapp.com",
  projectId: "dashboard-guru-gis-ps",
  storageBucket: "dashboard-guru-gis-ps.firebasestorage.app",
  messagingSenderId: "1094712862270",
  appId: "1:1094712862270:web:5145f392552306c017536f"
});
const auth = getAuth(app), db = getFirestore(app);
const ready = new Promise(r => { const u = onAuthStateChanged(auth, () => { u(); r(); }); });

const uid = () => { if (!auth.currentUser) { const e = new Error('Sesi berakhir. Silakan masuk lagi.'); e.auth = true; throw e; } return auth.currentUser.uid; };
const C = n => n === 'siswa' ? collection(db, 'siswa') : collection(db, 'users', uid(), n);
const D = (n, id) => n === 'siswa' ? doc(db, 'siswa', id) : doc(db, 'users', uid(), n, id);
const allOf = async (u, n) => (await getDocs(collection(db, 'users', u, n))).docs.map(d => ({ id: d.id, ...d.data() }));
const all = async n => (await getDocs(C(n))).docs.map(d => ({ id: d.id, ...d.data() }));
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
const cmp = (a, b) => String(a).localeCompare(String(b), 'id', { numeric: true });
const hKey = (t, k) => t + '_' + encodeURIComponent(k);
let ME = { nama: '' };
const prof = async u => {
  const [a, w, g] = await Promise.all([getDoc(doc(db, 'admins', u.uid)), getDoc(doc(db, 'wali', u.uid)), getDoc(doc(db, 'guru', u.uid))]);
  const admin = a.exists(), nama = u.displayName || u.email.split('@')[0];
  if (!admin) {
    if (!/@gistrav\.com$/i.test(u.email)) { await signOut(auth); throw new Error('Hanya email @gistrav.com yang dapat dipakai.'); }
  }
  if (!g.exists()) await setDoc(doc(db, 'guru', u.uid), { nama, email: u.email, aktif: admin, dibuat: Date.now() });
  if (!(admin || (g.exists() && g.data().aktif === true))) { await signOut(auth); throw new Error('Akun Anda menunggu persetujuan admin.'); }
  try { localStorage.setItem('dg_last', String(Date.now())); } catch (e) {}
  ME.nama = (g.exists() && g.data().nama) || nama;
  return { nama: ME.nama, admin, pwAwal: g.exists() && g.data().pwAwal === true, wali: w.exists() ? (w.data().kelas || []) : [] };
};
const load = async () => { const [s, h] = await Promise.all([all('siswa'), all('halaqah')]); return { s, h, m: new Map(s.map(x => [x.id, x])) }; };
const members = (g, m) => (g.anggota || []).map(i => m.get(i)).filter(Boolean);
const pil = async () => { const d = await getDoc(D('meta', 'pilihan')); const v = d.exists() ? d.data() : {}; return { mapel: v.mapel || [], jam: v.jam || [] }; };
const cnt = (docs, t) => { const c = { H: 0, S: 0, I: 0, A: 0 }; docs.filter(x => !t || x.tanggal === t).forEach(x => Object.values(x.records || {}).forEach(v => { if (v in c) c[v]++; })); return c; };
const sinkron = async (jid, d, lama) => {
  const baru = d ? d.kelasSiswa : [], id = k => doc(db, 'jurnalKelas', jid + '__' + encodeURIComponent(k));
  for (const k of lama) if (!baru.includes(k)) await deleteDoc(id(k)).catch(() => {});
  for (const k of baru) await setDoc(id(k), { ownerUid: uid(), guru: ME.nama, kelas: k, jurnalId: jid, tanggal: d.tanggal, mapel: d.mapel || '', jam: d.jam || '', metode: d.metode || '', materi: d.materi, hadir: d.hadir, total: d.total, evaluasi: d.evaluasi || '', kendala: d.kendala || '', refleksi: d.refleksi || '' });
};
const tNo = () => { throw new Error('Fitur ini tidak tersedia di versi Firebase.'); };

const A = {
  status: async () => ({ hasUsers: true }),
  me: async () => {
    await ready; if (!auth.currentUser) throw new Error('Belum masuk.');
    let l = 0; try { l = +localStorage.getItem('dg_last') || 0; } catch (e) {}
    if (l && Date.now() - l > 3600000) { await signOut(auth); throw new Error('Sesi berakhir karena tidak aktif.'); }
    return prof(auth.currentUser);
  },
  login: async p => {
    try { await signInWithEmailAndPassword(auth, p.username.trim(), p.password); }
    catch (e) { throw new Error(e.code === 'auth/network-request-failed' ? 'Tidak ada koneksi internet.' : 'Email atau password salah.'); }
    return { token: 'fb', user: await prof(auth.currentUser) };
  },
  register: async p => {
    const em = String(p.email || '').trim().toLowerCase(), nama = String(p.nama || '').trim();
    if (!nama) throw new Error('Nama lengkap wajib diisi.');
    if (!/^[^@\s]+@gistrav\.com$/.test(em)) throw new Error('Gunakan email sekolah berakhiran @gistrav.com.');
    const pw = em.split('@')[0];
    if (pw.length < 6) throw new Error('Nama sebelum @ minimal 6 karakter agar bisa dipakai sebagai password awal. Hubungi admin.');
    let c; try { c = await createUserWithEmailAndPassword(auth, em, pw); } catch (e) { throw new Error(e.code === 'auth/email-already-in-use' ? 'Email ini sudah terdaftar. Silakan masuk.' : 'Pendaftaran gagal. Periksa koneksi internet.'); }
    await updateProfile(c.user, { displayName: nama }).catch(() => {});
    try { await setDoc(doc(db, 'guru', c.user.uid), { nama, email: em, aktif: false, pwAwal: true, dibuat: Date.now() }); }
    catch (e) { await c.user.delete().catch(() => signOut(auth)); throw new Error(e.code === 'permission-denied' ? 'Email ini belum ada di daftar yang diizinkan. Hubungi admin agar email Anda ditambahkan.' : 'Pendaftaran gagal. Coba lagi.'); }
    await signOut(auth);
    return { ok: true };
  },
  resetPassword: async p => { const em = String(p.email || '').trim(); if (!em) throw new Error('Isi email Anda.'); await sendPasswordResetEmail(auth, em).catch(() => {}); },
  logout: async () => signOut(auth),
  ubahPassword: async p => {
    const u = auth.currentUser;
    try { await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, p.lama)); }
    catch (e) { throw new Error('Password lama salah.'); }
    await updatePassword(u, p.baru);
    await updateDoc(doc(db, 'guru', u.uid), { pwAwal: false }).catch(() => {});
  },

  siswaList: async () => { const { s, h, m } = await load(); return h.flatMap(g => members(g, m).map(x => ({ id: x.id, nama: x.nama, kelas: g.nama, kelasAsli: x.kelas, gender: x.gender || '', halaqahId: g.id }))); },
  masterList: async () => (await all('siswa')).sort((a, b) => cmp(a.nama, b.nama)).map(x => ({ id: x.id, nama: x.nama, kelas: x.kelas, gender: x.gender || '' })),
  halaqahList: async () => (await all('halaqah')).map(g => ({ id: g.id, nama: g.nama, jumlah: (g.anggota || []).length })).sort((a, b) => cmp(a.nama, b.nama)),
  halaqahSave: async p => {
    const nama = p.nama.trim(), h = await all('halaqah');
    if (h.some(x => x.id !== p.id && norm(x.nama) === norm(nama))) throw new Error('Nama kelas/halaqah sudah ada.');
    if (!p.id) return (await addDoc(C('halaqah'), { nama, anggota: [] })).id;
    const old = h.find(x => x.id === p.id);
    await updateDoc(D('halaqah', p.id), { nama });
    if (old && old.nama !== nama) {
      for (const j of await all('jurnal')) if (j.kelas === old.nama) await updateDoc(D('jurnal', j.id), { kelas: nama });
      for (const n of ['hadir', 'nilai']) for (const x of await all(n)) if (x.kelas === old.nama) {
        const { id, ...d } = x; d.kelas = nama;
        await setDoc(D(n, n === 'hadir' ? hKey(d.tanggal, nama) : encodeURIComponent(nama)), d); await deleteDoc(D(n, id));
      }
    }
    return p.id;
  },
  halaqahDelete: async p => deleteDoc(D('halaqah', p.id)),
  anggotaTambah: async p => {
    const g = (await getDoc(D('halaqah', p.halaqahId))).data() || {}, ada = new Set(g.anggota || []);
    const baru = p.siswaIds.filter(i => !ada.has(i));
    await updateDoc(D('halaqah', p.halaqahId), { anggota: [...ada, ...baru] });
    return baru.length;
  },
  anggotaHapus: async p => {
    const g = (await getDoc(D('halaqah', p.halaqahId))).data() || {};
    await updateDoc(D('halaqah', p.halaqahId), { anggota: (g.anggota || []).filter(i => i !== p.siswaId) });
  },
  siswaTambah: async p => {
    const s = await all('siswa'), same = s.filter(x => norm(x.nama) === norm(p.nama));
    const link = async id => { if (p.halaqahId) await A.anggotaTambah({ halaqahId: p.halaqahId, siswaIds: [id] }); };
    const ex = same.find(x => norm(x.kelas) === norm(p.kelas));
    if (ex) { await link(ex.id); return { status: 'ada' }; }
    if (same.length && !p.paksa) return { status: 'mirip', serupa: same.map(x => ({ id: x.id, nama: x.nama, kelas: x.kelas })) };
    const id = (await addDoc(C('siswa'), { nama: p.nama.trim(), kelas: String(p.kelas).trim(), gender: p.gender || '' })).id;
    await link(id); return { status: 'baru', id };
  },
  siswaImport: async p => {
    const s = await all('siswa'); let baru = 0, terhubung = 0, mirip = 0; const ids = [];
    for (const i of p.items) {
      const same = s.filter(x => norm(x.nama) === norm(i.nama));
      let x = same.find(y => norm(y.kelas) === norm(i.kelas)) || same[0];
      if (x) { terhubung++; if (norm(x.kelas) !== norm(i.kelas)) mirip++; }
      else { x = { nama: i.nama.trim(), kelas: String(i.kelas), gender: i.gender || '' }; x.id = (await addDoc(C('siswa'), x)).id; s.push(x); baru++; }
      ids.push(x.id);
    }
    if (p.halaqahId) await A.anggotaTambah({ halaqahId: p.halaqahId, siswaIds: ids });
    return { baru, terhubung, mirip };
  },

  pilihanList: async () => { const v = await pil(); return { mapel: v.mapel.sort(cmp), jam: v.jam.sort(cmp) }; },
  pilihanSave: async p => { const v = await pil(), n = p.nilai.trim(); if (n && !v[p.jenis].includes(n)) v[p.jenis].push(n); await setDoc(D('meta', 'pilihan'), v); return A.pilihanList(); },
  pilihanDelete: async p => { const v = await pil(); v[p.jenis] = v[p.jenis].filter(x => x !== p.nilai); await setDoc(D('meta', 'pilihan'), v); return A.pilihanList(); },

  jurnalList: async () => (await all('jurnal')).sort((a, b) => cmp(b.tanggal + (b.createdAt || 0), a.tanggal + (a.createdAt || 0))).map(j => ({ mapel: '', jam: '', metode: '', evaluasi: '', kendala: '', refleksi: '', hadir: '', total: 0, ...j })),
  jurnalSave: async p => {
    const { id, ...d } = p, { h, m } = await load(), g = h.find(x => x.nama === d.kelas), mem = g ? members(g, m) : [];
    d.total = mem.length; d.hadir = d.hadir === '' ? '' : +d.hadir; d.kelasSiswa = [...new Set(mem.map(x => String(x.kelas).trim()))];
    for (const k of ['mapel', 'jam']) if (d[k]) await A.pilihanSave({ jenis: k, nilai: d[k] });
    let jid = id, lama = [];
    if (id) { lama = ((await getDoc(D('jurnal', id))).data() || {}).kelasSiswa || []; await updateDoc(D('jurnal', id), d); }
    else { d.createdAt = Date.now(); jid = (await addDoc(C('jurnal'), d)).id; }
    await sinkron(jid, d, lama);
  },
  jurnalDelete: async p => { const lama = ((await getDoc(D('jurnal', p.id))).data() || {}).kelasSiswa || []; await sinkron(p.id, null, lama); await deleteDoc(D('jurnal', p.id)); },
  adminGuru: async () => {
    const [gs, ws] = await Promise.all([getDocs(collection(db, 'guru')), getDocs(collection(db, 'wali'))]);
    const wali = Object.fromEntries(ws.docs.map(d => [d.id, d.data().kelas || []]));
    return (await Promise.all(gs.docs.map(async d => { const j = await allOf(d.id, 'jurnal'); return { uid: d.id, ...d.data(), wali: wali[d.id] || [], jurnal: j.length, terakhir: j.map(x => x.tanggal).sort().pop() || '' }; }))).sort((a, b) => cmp(a.nama, b.nama));
  },
  adminSetNama: async p => { const n = p.nama.trim(); if (!n) throw new Error('Nama tidak boleh kosong.'); await updateDoc(doc(db, 'guru', p.uid), { nama: n }); },
  adminJurnalSemua: async () => { const gs = await getDocs(collection(db, 'guru')); return (await Promise.all(gs.docs.map(async d => (await allOf(d.id, 'jurnal')).map(j => ({ ...j, guru: d.data().nama }))))).flat().sort((a, b) => cmp(a.tanggal, b.tanggal)); },
  karyaList: async p => (await getDocs(query(C('karya'), where('siswaId', '==', p.siswaId)))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => cmp(b.tanggal, a.tanggal) || (b.dibuat - a.dibuat)),
  karyaSave: async p => { if (p.foto.length > 900000) throw new Error('Foto terlalu besar.'); await addDoc(C('karya'), { siswaId: p.siswaId, label: p.label, foto: p.foto, tanggal: p.tanggal, dibuat: Date.now() }); },
  karyaDelete: async p => deleteDoc(D('karya', p.id)),
  undanganList: async () => (await getDocs(collection(db, 'undangan'))).docs.map(d => ({ ...d.data(), email: d.id })).sort((a, b) => cmp(a.email, b.email)),
  undanganTambah: async p => {
    let ok = 0; const salah = [];
    for (const i of p.items) { if (!/^[^@\s]+@gistrav\.com$/.test(i.email)) { salah.push(i.email); continue; } await setDoc(doc(db, 'undangan', i.email), { email: i.email, nama: i.nama || '', dibuat: Date.now() }); ok++; }
    return { ok, salah };
  },
  undanganHapus: async p => deleteDoc(doc(db, 'undangan', p.email)),
  siswaInduk: async () => {
    const [s, gs] = await Promise.all([all('siswa'), getDocs(collection(db, 'guru'))]);
    const hs = (await Promise.all(gs.docs.map(d => allOf(d.id, 'halaqah')))).flat(), n = {};
    hs.forEach(h => (h.anggota || []).forEach(i => { n[i] = (n[i] || 0) + 1; }));
    return s.map(x => ({ id: x.id, nama: x.nama, kelas: String(x.kelas), gender: x.gender || '', dipakai: n[x.id] || 0 })).sort((a, b) => cmp(a.kelas, b.kelas) || cmp(a.nama, b.nama));
  },
  siswaEdit: async p => { if (!p.nama.trim() || !String(p.kelas).trim()) throw new Error('Nama dan kelas wajib diisi.'); await updateDoc(D('siswa', p.id), { nama: p.nama.trim(), kelas: String(p.kelas).trim(), gender: p.gender || '' }); },
  siswaHapus: async p => deleteDoc(D('siswa', p.id)),
  adminSetAktif: async p => updateDoc(doc(db, 'guru', p.uid), { aktif: !!p.aktif }),
  adminSetWali: async p => {
    const ks = [...new Set((await all('siswa')).map(x => String(x.kelas).trim()))], kelas = p.kelas.map(k => ks.find(x => norm(x) === norm(k)) || k);
    if (kelas.length) await setDoc(doc(db, 'wali', p.uid), { kelas }); else await deleteDoc(doc(db, 'wali', p.uid));
  },
  adminDetail: async p => ({
    jurnal: (await allOf(p.uid, 'jurnal')).sort((a, b) => cmp(b.tanggal, a.tanggal)),
    hadir: (await allOf(p.uid, 'hadir')).map(x => ({ tanggal: x.tanggal, kelas: x.kelas, ...cnt([x]) })).sort((a, b) => cmp(b.tanggal, a.tanggal))
  }),
  waliJurnal: async p => (await getDocs(query(collection(db, 'jurnalKelas'), where('kelas', '==', p.kelas)))).docs.map(d => d.data()).sort((a, b) => cmp(b.tanggal, a.tanggal)),

  hadirGet: async p => ((await getDoc(D('hadir', hKey(p.tanggal, p.kelas)))).data() || {}).records || {},
  hadirSave: async p => setDoc(D('hadir', hKey(p.tanggal, p.kelas)), { tanggal: p.tanggal, kelas: p.kelas, records: Object.fromEntries(p.records.map(r => [r.siswaId, r.status])) }),
  hadirSesi: async () => (await all('hadir')).map(x => ({ tanggal: x.tanggal, kelas: x.kelas, ...cnt([x]) })).sort((a, b) => cmp(b.tanggal, a.tanggal) || cmp(a.kelas, b.kelas)),
  hadirRekap: async p => {
    const { h, m } = await load(), g = h.find(x => x.nama === p.kelas);
    const docs = (await all('hadir')).filter(x => x.kelas === p.kelas && x.tanggal.startsWith(p.bulan));
    const rows = (g ? members(g, m) : []).sort((a, b) => cmp(a.nama, b.nama)).map(x => {
      const r = { nama: x.nama, gender: x.gender || '', H: 0, S: 0, I: 0, A: 0 };
      docs.forEach(d => { const v = (d.records || {})[x.id]; if (v in r) r[v]++; });
      return r;
    });
    return { hari: docs.length, rows };
  },
  hadirPindah: async p => {
    if ((await getDoc(D('hadir', hKey(p.ke, p.kelas)))).exists()) throw new Error('Sudah ada absensi kelas ini pada tanggal tersebut.');
    const d = (await getDoc(D('hadir', hKey(p.dari, p.kelas)))).data();
    if (d) { d.tanggal = p.ke; await setDoc(D('hadir', hKey(p.ke, p.kelas)), d); await deleteDoc(D('hadir', hKey(p.dari, p.kelas))); }
  },
  hadirHapus: async p => deleteDoc(D('hadir', hKey(p.tanggal, p.kelas))),

  nilaiGet: async p => ((await getDoc(D('nilai', encodeURIComponent(p.kelas)))).data() || {}).rows || {},
  nilaiSave: async p => setDoc(D('nilai', encodeURIComponent(p.kelas)), { kelas: p.kelas, rows: Object.fromEntries(p.rows.map(r => [r.siswaId, { ts: r.t, u: r.uts }])) }),

  summary: async p => {
    const [{ s, h, m }, j, ha] = await Promise.all([load(), all('jurnal'), all('hadir')]);
    const ids = new Set(h.flatMap(g => g.anggota || [])), ss = [...ids].map(i => m.get(i)).filter(Boolean);
    const day = k => { const d = new Date(p.today + 'T12:00:00'); d.setDate(d.getDate() - k); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const urut = j.sort((a, b) => cmp(b.tanggal + (b.createdAt || 0), a.tanggal + (a.createdAt || 0)));
    return {
      totalSiswa: ss.length, laki: ss.filter(x => x.gender === 'L').length, perempuan: ss.filter(x => x.gender === 'P').length,
      kelas: h.map(g => { const a = members(g, m); return { kelas: g.nama, jumlah: a.length, L: a.filter(x => x.gender === 'L').length, P: a.filter(x => x.gender === 'P').length }; }).sort((a, b) => cmp(a.kelas, b.kelas)),
      jurnalBulanIni: j.filter(x => x.tanggal.startsWith(p.today.slice(0, 7))).length, jurnalTotal: j.length, jurnalTerbaru: urut.slice(0, 5),
      hariIni: cnt(ha, p.today),
      minggu: [6, 5, 4, 3, 2, 1, 0].map(k => { const t = day(k), c = cnt(ha, t); return { tanggal: t, hadir: c.H, total: c.H + c.S + c.I + c.A }; }),
      menunggu: 0
    };
  }
};

window.__fbRes(async (action, payload) => {
  try { return await (A[action] || tNo)(payload || {}); }
  catch (e) { if (e && e.code === 'permission-denied') throw new Error('Akses ditolak. Periksa aturan Firestore dan pastikan Anda sudah masuk.'); throw e; }
});
</script>
